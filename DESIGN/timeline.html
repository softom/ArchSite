<script type="text/babel">
// Общие компоненты для всплывающих иконок и листа-статьи.
// Подключаются перед ArchiveA / LabB. Экспортируют:
//   window.ArtIcon       — <ArtIcon kind size color />
//   window.ArticleSheet  — <ArticleSheet item kind theme onClose />
//   window.getArticle(kind, id) -> { lede, sections, facts, quote? }

(function () {
  const ART = window.TIMELINE_ART;
  const DATA = window.TIMELINE_DATA;

  // Возвращает SVG-разметку (innerHTML) или null.
  function getIconMarkup(kind, id) {
    const bucket = ART[kind] && ART[kind].icon;
    return (bucket && bucket[id]) || null;
  }

  function getArticle(kind, id) {
    const bucket = ART[kind] && ART[kind].article;
    if (bucket && bucket[id]) return bucket[id];
    // context-segment: синтезируем мини-статью из самого сегмента
    if (kind === 'context' && id && typeof id === 'object') {
      const seg = id;
      return {
        lede: seg.lineLabel
          ? `${seg.label} — фрагмент линии «${seg.lineLabel}». ${formatYear(seg.start)} → ${formatYear(seg.end)}.`
          : `${seg.label}. ${formatYear(seg.start)} → ${formatYear(seg.end)}.`,
        sections: [
          { title: 'Контекст', body: 'Контекстная линия — фоновое явление эпохи: религия, политические режимы, войны, идеи или технологии. Она не описывает конкретное здание, но объясняет, в какой среде эти здания появлялись.' },
          { title: 'Период', body: `${formatYear(seg.start)} — ${formatYear(seg.end)}. Длительность: ~${Math.abs((seg.end || 0) - (seg.start || 0))} лет.` },
        ],
        facts: [
          { k: 'линия', v: seg.lineLabel || '—' },
          { k: 'начало', v: formatYear(seg.start) },
          { k: 'конец',  v: formatYear(seg.end) },
        ],
      };
    }
    // fallback: вытаскиваем минимум из основного датасета
    let raw = null;
    if (kind === 'objects') raw = DATA.objects.find(o => o.id === id);
    if (kind === 'styles')  raw = DATA.styles.find(o => o.id === id);
    if (kind === 'epochs')  raw = DATA.epochs.find(o => o.id === id);
    return raw ? ART.fallback(raw) : null;
  }

  // <ArtIcon kind="objects" id="parthenon" size={48} color="#1A1A1A" />
  function ArtIcon({ kind, id, size = 48, color, style }) {
    const markup = getIconMarkup(kind, id);
    if (!markup) {
      // плейсхолдер
      return React.createElement('div', {
        style: {

//     </DCSection>
//   </DesignCanvas>

const DC = {
  bg: '#f0eee9',
  grid: 'rgba(0,0,0,0.06)',
  label: 'rgba(60,50,40,0.7)',
  title: 'rgba(40,30,20,0.85)',
  subtitle: 'rgba(60,50,40,0.6)',
  postitBg: '#fef4a8',
  postitText: '#5a4a2a',
  font: '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif',
};

// One-time CSS injection (classes are dc-prefixed so they don't collide with
// the hosted design's own styles).
if (typeof document !== 'undefined' && !document.getElementById('dc-styles')) {
  const s = document.createElement('style');
  s.id = 'dc-styles';
  s.textContent = [
    '.dc-editable{cursor:text;outline:none;white-space:nowrap;border-radius:3px;padding:0 2px;margin:0 -2px}',
    '.dc-editable:focus{background:#fff;box-shadow:0 0 0 1.5px #c96442}',
    '[data-dc-slot]{transition:transform .18s cubic-bezier(.2,.7,.3,1)}',
    '[data-dc-slot].dc-dragging{transition:none;z-index:10;pointer-events:none}',
    '[data-dc-slot].dc-dragging .dc-card{box-shadow:0 12px 40px rgba(0,0,0,.25),0 0 0 2px #c96442;transform:scale(1.02)}',
    '.dc-card{transition:box-shadow .15s,transform .15s}',
    '.dc-card *{scrollbar-width:none}',
    '.dc-card *::-webkit-scrollbar{display:none}',
    '.dc-labelrow{display:flex;align-items:center;gap:4px;height:24px}',
    '.dc-grip{cursor:grab;display:flex;align-items:center;padding:5px 4px;border-radius:4px;transition:background .12s}',
    '.dc-grip:hover{background:rgba(0,0,0,.08)}',
    '.dc-grip:active{cursor:grabbing}',
    '.dc-labeltext{cursor:pointer;border-radius:4px;padding:3px 6px;display:flex;align-items:center;transition:background .12s}',
    '.dc-labeltext:hover{background:rgba(0,0,0,.05)}',
    '.dc-expand{position:absolute;bottom:100%;right:0;margin-bottom:5px;z-index:2;opacity:0;transition:opacity .12s,background .12s;',
    '  width:22px;height:22px;border-radius:5px;border:none;cursor:pointer;padding:0;',
    '  background:transparent;color:rgba(60,50,40,.7);display:flex;align-items:center;justify-content:center}',
    '.dc-expand:hover{background:rgba(0,0,0,.06);color:#2a251f}',
    '[data-dc-slot]:hover .dc-expand{opacity:1}',
  ].join('\n');
  document.head.appendChild(s);
}

const DCCtx = React.createContext(null);

// ─────────────────────────────────────────────────────────────
// DesignCanvas — stateful wrapper around the pan/zoom viewport.
// Owns runtime state (per-section order, renamed titles/labels, focused
// artboard). Order/titles/labels persist to a .design-canvas.state.json
// sidecar next to the HTML. Reads go via plain fetch() so the saved
// arrangement is visible anywhere the HTML + sidecar are served together
// (omelette preview, direct link, downloaded zip). Writes go through the
// host's window.omelette bridge — editing requires the omelette runtime.
// Focus is ephemeral.
// ─────────────────────────────────────────────────────────────
const DC_STATE_FILE = '.design-canvas.state.json';

function DesignCanvas({ children, minScale, maxScale, style }) {
  const [state, setState] = React.useState({ sections: {}, focus: null });
  // Hold rendering until the sidecar read settles so the saved order/titles
  // appear on first paint (no source-order flash). didRead gates writes until
  // the read settles so the empty initial state can't clobber a slow read;
  // skipNextWrite suppresses the one echo-write that would otherwise follow
  // hydration.
  const [ready, setReady] = React.useState(false);
  const didRead = React.useRef(false);
  const skipNextWrite = React.useRef(false);

  React.useEffect(() => {
    let off = false;
    fetch('./' + DC_STATE_FILE)
      .then((r) => (r.ok ? r.json() : null))
      .then((saved) => {
        if (off || !saved || !saved.sections) return;
        skipNextWrite.current = true;
        setState((s) => ({ ...s, sections: saved.sections }));
      })
      .catch(() => {})
      .finally(() => { didRead.current = true; if (!off) setReady(true); });
    const t = setTimeout(() => { if (!off) setReady(true); }, 150);
    return () => { off = true; clearTimeout(t); };
  }, []);

  React.useEffect(() => {
    if (!didRead.current) return;
    if (skipNextWrite.current) { skipNextWrite.current = false; return; }
    const t = setTimeout(() => {
      window.omelette?.writeFile(DC_STATE_FILE, JSON.stringify({ sections: state.sections })).catch(() => {});
    }, 250);
    return () => clearTimeout(t);
  }, [state.sections]);

  // Build registries synchronously from children so FocusOverlay can read
  // them in the same render. Only direct DCSection > DCArtboard children are
  // walked — wrapping them in other elements opts out of focus/reorder.
  const registry = {};     // slotId -> { sectionId, artboard }
  const sectionMeta = {};  // sectionId -> { title, subtitle, slotIds[] }
  const sectionOrder = [];
  React.Children.forEach(children, (sec) => {
    if (!sec || sec.type !== DCSection) return;
    const sid = sec.props.id ?? sec.props.title;
    if (!sid) return;
    sectionOrder.push(sid);
    const persisted = state.sections[sid] || {};
    const srcIds = [];
    React.Children.forEach(sec.props.children, (ab) => {
      if (!ab || ab.type !== DCArtboard) return;
      const aid = ab.props.id ?? ab.props.label;
      if (!aid) return;
      registry[`${sid}/${aid}`] = { sectionId: sid, artboard: ab };
      srcIds.push(aid);
    });
    const kept = (persisted.order || []).filter((k) => srcIds.includes(k));
    sectionMeta[sid] = {
      title: persisted.title ?? sec.props.title,
      subtitle: sec.props.subtitle,
      slotIds: [...kept, ...srcIds.filter((k) => !kept.includes(k))],
    };
  });

  const api = React.useMemo(() => ({
    state,
    section: (id) => state.sections[id] || {},
    patchSection: (id, p) => setState((s) => ({
      ...s,
      sections: { ...s.sections, [id]: { ...s.sections[id], ...(typeof p === 'function' ? p(s.sections[id] || {}) : p) } },
    })),
    setFocus: (slotId) => setState((s) => ({ ...s, focus: slotId })),
  }), [state]);

  // Esc exits focus; any outside pointerdown commits an in-progress rename.
  React.useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') api.setFocus(null); };
    const onPd = (e) => {
      const ae = document.activeElement;
      if (ae && ae.isContentEditable && !ae.contains(e.target)) ae.blur();
    };
    document.addEventListener('keydown', onKey);
    document.addEventListener('pointerdown', onPd, true);
    return () => {
      document.removeEventListener('keydown', onKey);
      document.removeEventListener('pointerdown', onPd, true);
    };
  }, [api]);

  return (
    <DCCtx.Provider value={api}>
      <DCViewport minScale={minScale} maxScale={maxScale} style={style}>{ready && children}</DCViewport>
      {state.focus && registry[state.focus] && (
        <DCFocusOverlay entry={registry[state.focus]} sectionMeta={sectionMeta} sectionOrder={sectionOrder} />
      )}
    </DCCtx.Provider>
  );
}

// ─────────────────────────────────────────────────────────────
// DCViewport — transform-based pan/zoom (internal)
//
// Input mapping (Figma-style):
//   • trackpad pinch  → zoom   (ctrlKey wheel; Safari gesture* events)
//   • trackpad scroll → pan    (two-finger)
//   • mouse wheel     → zoom   (notched; distinguished from trackpad scroll)
//   • middle-drag / primary-drag-on-bg → pan
//
// Transform state lives in a ref and is written straight to the DOM
// (translate3d + will-change) so wheel ticks don't go through React —
// keeps pans at 60fps on dense canvases.
// ─────────────────────────────────────────────────────────────
function DCViewport({ children, minScale = 0.1, maxScale = 8, style = {} }) {
  const vpRef = React.useRef(null);
  const worldRef = React.useRef(null);
  const tf = React.useRef({ x: 0, y: 0, scale: 1 });

  const apply = React.useCallback(() => {
    const { x, y, scale } = tf.current;
    const el = worldRef.current;
    if (el) el.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${scale})`;
  }, []);

  React.useEffect(() => {
    const vp = vpRef.current;
    if (!vp) return;

    const zoomAt = (cx, cy, factor) => {
      const r = vp.getBoundingClientRect();
      const px = cx - r.left, py = cy - r.top;
      const t = tf.current;
      const next = Math.min(maxScale, Math.max(minScale, t.scale * factor));
      const k = next / t.scale;
      // keep the world point under the cursor fixed
      t.x = px - (px - t.x) * k;
      t.y = py - (py - t.y) * k;
      t.scale = next;
      apply();
    };

    // Mouse-wheel vs trackpad-scroll heuristic. A physical wheel sends
    // line-mode deltas (Firefox) or large integer pixel deltas with no X
    // component (Chrome/Safari, typically multiples of 100/120). Trackpad
    // two-finger scroll sends small/fractional pixel deltas, often with
    // non-zero deltaX. ctrlKey is set by the browser for trackpad pinch.
    const isMouseWheel = (e) =>
      e.deltaMode !== 0 ||
      (e.deltaX === 0 && Number.isInteger(e.deltaY) && Math.abs(e.deltaY) >= 40);

    const onWheel = (e) => {
      e.preventDefault();
      if (isGesturing) return; // Safari: gesture* owns the pinch — discard concurrent wheels
      if (e.ctrlKey) {
        // trackpad pinch (or explicit ctrl+wheel)
        zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01));
      } else if (isMouseWheel(e)) {
        // notched mouse wheel — fixed-ratio step per click
        zoomAt(e.clientX, e.clientY, Math.exp(-Math.sign(e.deltaY) * 0.18));
      } else {
        // trackpad two-finger scroll — pan
        tf.current.x -= e.deltaX;
        tf.current.y -= e.deltaY;
        apply();
      }
    };

    // Safari sends native gesture* events for trackpad pinch with a smooth
    // e.scale; preferring these over the ctrl+wheel fallback gives a much
    // better feel there. No-ops on other browsers. Safari also fires
    // ctrlKey wheel events during the same pinch — isGesturing makes
    // onWheel drop those entirely so they neither zoom nor pan.
    let gsBase = 1;
    let isGesturing = false;
    const onGestureStart = (e) => { e.preventDefault(); isGesturing = true; gsBase = tf.current.scale; };
    const onGestureChange = (e) => {
      e.preventDefault();
      zoomAt(e.clientX, e.clientY, (gsBase * e.scale) / tf.current.scale);
    };
    const onGestureEnd = (e) => { e.preventDefault(); isGesturing = false; };

    // Drag-pan: middle button anywhere, or primary button on canvas
    // background (anything that isn't an artboard or an inline editor).
    let drag = null;
    const onPointerDown = (e) => {
      const onBg = !e.target.closest('[data-dc-slot], .dc-editable');
      if (!(e.button === 1 || (e.button === 0 && onBg))) return;
      e.preventDefault();
      vp.setPointerCapture(e.pointerId);
      drag = { id: e.pointerId, lx: e.clientX, ly: e.clientY };
      vp.style.cursor = 'grabbing';
    };
    const onPointerMove = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      tf.current.x += e.clientX - drag.lx;
      tf.current.y += e.clientY - drag.ly;
      drag.lx = e.clientX; drag.ly = e.clientY;
      apply();
    };
    const onPointerUp = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      vp.releasePointerCapture(e.pointerId);
      drag = null;
      vp.style.cursor = '';
    };

    vp.addEventListener('wheel', onWheel, { passive: false });
    vp.addEventListener('gesturestart', onGestureStart, { passive: false });
    vp.addEventListener('gesturechange', onGestureChange, { passive: false });
    vp.addEventListener('gestureend', onGestureEnd, { passive: false });
    vp.addEventListener('pointerdown', onPointerDown);
    vp.addEventListener('pointermove', onPointerMove);
    vp.addEventListener('pointerup', onPointerUp);
    vp.addEventListener('pointercancel', onPointerUp);
    return () => {
      vp.removeEventListener('wheel', onWheel);
      vp.removeEventListener('gesturestart', onGestureStart);
      vp.removeEventListener('gesturechange', onGestureChange);
      vp.removeEventListener('gestureend', onGestureEnd);
      vp.removeEventListener('pointerdown', onPointerDown);
      vp.removeEventListener('pointermove', onPointerMove);
      vp.removeEventListener('pointerup', onPointerUp);
      vp.removeEventListener('pointercancel', onPointerUp);
    };
  }, [apply, minScale, maxScale]);

  const gridSvg = `url("data:image/svg+xml,%3Csvg width='120' height='120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M120 0H0v120' fill='none' stroke='${encodeURIComponent(DC.grid)}' stroke-width='1'/%3E%3C/svg%3E")`;
  return (
    <div
      ref={vpRef}
      className="design-canvas"
      style={{
        height: '100vh', width: '100vw',
        background: DC.bg,
        overflow: 'hidden',
        overscrollBehavior: 'none',
        touchAction: 'none',
        position: 'relative',
        fontFamily: DC.font,
        boxSizing: 'border-box',
        ...style,
      }}
    >
      <div
        ref={worldRef}
        style={{
          position: 'absolute', top: 0, left: 0,
          transformOrigin: '0 0',
          willChange: 'transform',
          width: 'max-content', minWidth: '100%',
          minHeight: '100%',
          padding: '60px 0 80px',
        }}
      >
        <div style={{ position: 'absolute', inset: -6000, backgroundImage: gridSvg, backgroundSize: '120px 120px', pointerEvents: 'none', zIndex: -1 }} />
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// DCSection — editable title + h-row of artboards in persisted order
// ─────────────────────────────────────────────────────────────
function DCSection({ id, title, subtitle, children, gap = 48 }) {
  const ctx = React.useContext(DCCtx);
  const sid = id ?? title;
  const all = React.Children.toArray(children);
  const artboards = all.filter((c) => c && c.type === DCArtboard);
  const rest = all.filter((c) => !(c && c.type === DCArtboard));
  const srcOrder = artboards.map((a) => a.props.id ?? a.props.label);
  const sec = (ctx && sid && ctx.section(sid)) || {};

  const order = React.useMemo(() => {
    const kept = (sec.order || []).filter((k) => srcOrder.includes(k));
    return [...kept, ...srcOrder.filter((k) => !kept.includes(k))];
  }, [sec.order, srcOrder.join('|')]);

  const byId = Object.fromEntries(artboards.map((a) => [a.props.id ?? a.props.label, a]));

  return (
    <div data-dc-section={sid} style={{ marginBottom: 80, position: 'relative' }}>
      <div style={{ padding: '0 60px 56px' }}>
        <DCEditable tag="div" value={sec.title ?? title}
          onChange={(v) => ctx && sid && ctx.patchSection(sid, { title: v })}
          style={{ fontSize: 28, fontWeight: 600, color: DC.title, letterSpacing: -0.4, marginBottom: 6, display: 'inline-block' }} />
        {subtitle && <div style={{ fontSize: 16, color: DC.subtitle }}>{subtitle}</div>}
      </div>
      <div style={{ display: 'flex', gap, padding: '0 60px', alignItems: 'flex-start', width: 'max-content' }}>
        {order.map((k) => (
          <DCArtboardFrame key={k} sectionId={sid} artboard={byId[k]} order={order}
            label={(sec.labels || {})[k] ?? byId[k].props.label}
            onRename={(v) => ctx && ctx.patchSection(sid, (x) => ({ labels: { ...x.labels, [k]: v } }))}
            onReorder={(next) => ctx && ctx.patchSection(sid, { order: next })}
            onFocus={() => ctx && ctx.setFocus(`${sid}/${k}`)} />
        ))}
      </div>
      {rest}
    </div>
  );
}

// DCArtboard — marker; rendered by DCArtboardFrame via DCSection.
function DCArtboard() { return null; }

function DCArtboardFrame({ sectionId, artboard, label, order, onRename, onReorder, onFocus }) {
  const { id: rawId, label: rawLabel, width = 260, height = 480, children, style = {} } = artboard.props;
  const id = rawId ?? rawLabel;
  const ref = React.useRef(null);

  // Live drag-reorder: dragged card sticks to cursor; siblings slide into
  // their would-be slots in real time via transforms. DOM order only
  // changes on drop.
  const onGripDown = (e) => {
    e.preventDefault(); e.stopPropagation();
    const me = ref.current;
    // translateX is applied in local (pre-scale) space but pointer deltas and
    // getBoundingClientRect().left are screen-space — divide by the viewport's
    // current scale so the dragged card tracks the cursor at any zoom level.
    const scale = me.getBoundingClientRect().width / me.offsetWidth || 1;
    const peers = Array.from(document.querySelectorAll(`[data-dc-section="${sectionId}"] [data-dc-slot]`));
    const homes = peers.map((el) => ({ el, id: el.dataset.dcSlot, x: el.getBoundingClientRect().left }));
    const slotXs = homes.map((h) => h.x);
    const startIdx = order.indexOf(id);
    const startX = e.clientX;
    let liveOrder = order.slice();
    me.classList.add('dc-dragging');

    const layout = () => {
      for (const h of homes) {
        if (h.id === id) continue;
        const slot = liveOrder.indexOf(h.id);
        h.el.style.transform = `translateX(${(slotXs[slot] - h.x) / scale}px)`;
      }
    };

    const move = (ev) => {
      const dx = ev.clientX - startX;
      me.style.transform = `translateX(${dx / scale}px)`;
      const cur = homes[startIdx].x + dx;
      let nearest = 0, best = Infinity;
      for (let i = 0; i < slotXs.length; i++) {
        const d = Math.abs(slotXs[i] - cur);
        if (d < best) { best = d; nearest = i; }
      }
      if (liveOrder.indexOf(id) !== nearest) {
        liveOrder = order.filter((k) => k !== id);
        liveOrder.splice(nearest, 0, id);
        layout();
      }
    };

    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      const finalSlot = liveOrder.indexOf(id);
      me.classList.remove('dc-dragging');
      me.style.transform = `translateX(${(slotXs[finalSlot] - homes[startIdx].x) / scale}px)`;
      // After the settle transition, kill transitions + clear transforms +
      // commit the reorder in the same frame so there's no visual snap-back.
      setTimeout(() => {
        for (const h of homes) { h.el.style.transition = 'none'; h.el.style.transform = ''; }
        if (liveOrder.join('|') !== order.join('|')) onReorder(liveOrder);
        requestAnimationFrame(() => requestAnimationFrame(() => {
          for (const h of homes) h.el.style.transition = '';
        }));
      }, 180);
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  };

  return (
    <div ref={ref} data-dc-slot={id} style={{ position: 'relative', flexShrink: 0 }}>
      <div className="dc-labelrow" style={{ position: 'absolute', bottom: '100%', left: -4, marginBottom: 4, color: DC.label }}>
        <div className="dc-grip" onPointerDown={onGripDown} title="Drag to reorder">
          <svg width="9" height="13" viewBox="0 0 9 13" fill="currentColor"><circle cx="2" cy="2" r="1.1"/><circle cx="7" cy="2" r="1.1"/><circle cx="2" cy="6.5" r="1.1"/><circle cx="7" cy="6.5" r="1.1"/><circle cx="2" cy="11" r="1.1"/><circle cx="7" cy="11" r="1.1"/></svg>
        </div>
        <div className="dc-labeltext" onClick={onFocus} title="Click to focus">
          <DCEditable value={label} onChange={onRename} onClick={(e) => e.stopPropagation()}
            style={{ fontSize: 15, fontWeight: 500, color: DC.label, lineHeight: 1 }} />
        </div>
      </div>
      <button className="dc-expand" onClick={onFocus} onPointerDown={(e) => e.stopPropagation()} title="Focus">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M7 1h4v4M5 11H1V7M11 1L7.5 4.5M1 11l3.5-3.5"/></svg>
      </button>
      <div className="dc-card"
        style={{ borderRadius: 2, boxShadow: '0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06)', overflow: 'hidden', width, height, background: '#fff', ...style }}>
        {children || <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#bbb', fontSize: 13, fontFamily: DC.font }}>{id}</div>}
      </div>
    </div>
  );
}

// Inline rename — commits on blur or Enter.
function DCEditable({ value, onChange, style, tag = 'span', onClick }) {
  const T = tag;
  return (
    <T className="dc-editable" contentEditable suppressContentEditableWarning
      onClick={onClick}
      onPointerDown={(e) => e.stopPropagation()}
      onBlur={(e) => onChange && onChange(e.currentTarget.textContent)}
      onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); e.currentTarget.blur(); } }}
      style={style}>{value}</T>
  );
}

// ─────────────────────────────────────────────────────────────
// Focus mode — overlay one artboard; ←/→ within section, ↑/↓ across
// sections, Esc or backdrop click to exit.
// ─────────────────────────────────────────────────────────────
function DCFocusOverlay({ entry, sectionMeta, sectionOrder }) {
  const ctx = React.useContext(DCCtx);
  const { sectionId, artboard } = entry;
  const sec = ctx.section(sectionId);
  const meta = sectionMeta[sectionId];
  const peers = meta.slotIds;
  const aid = artboard.props.id ?? artboard.props.label;
  const idx = peers.indexOf(aid);
  const secIdx = sectionOrder.indexOf(sectionId);

  const go = (d) => { const n = peers[(idx + d + peers.length) % peers.length]; if (n) ctx.setFocus(`${sectionId}/${n}`); };
  const goSection = (d) => {
    const ns = sectionOrder[(secIdx + d + sectionOrder.length) % sectionOrder.length];
    const first = sectionMeta[ns] && sectionMeta[ns].slotIds[0];
    if (first) ctx.setFocus(`${ns}/${first}`);
  };

  React.useEffect(() => {
    const k = (e) => {
      if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
      if (e.key === 'ArrowUp') { e.preventDefault(); goSection(-1); }
      if (e.key === 'ArrowDown') { e.preventDefault(); goSection(1); }
    };
    document.addEventListener('keydown', k);
    return () => document.removeEventListener('keydown', k);
  });

  const { width = 260, height = 480, children } = artboard.props;
  const [vp, setVp] = React.useState({ w: window.innerWidth, h: window.innerHeight });
  React.useEffect(() => { const r = () => setVp({ w: window.innerWidth, h: window.innerHeight }); window.addEventListener('resize', r); return () => window.removeEventListener('resize', r); }, []);
  const scale = Math.max(0.1, Math.min((vp.w - 200) / width, (vp.h - 260) / height, 2));

  const [ddOpen, setDd] = React.useState(false);
  const Arrow = ({ dir, onClick }) => (
    <button onClick={(e) => { e.stopPropagation(); onClick(); }}
      style={{ position: 'absolute', top: '50%', [dir]: 28, transform: 'translateY(-50%)',
        border: 'none', background: 'rgba(255,255,255,.08)', color: 'rgba(255,255,255,.9)',
        width: 44, height: 44, borderRadius: 22, fontSize: 18, cursor: 'pointer',
        display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'background .15s' }}
      onMouseEnter={(e) => (e.currentTarget.style.background = 'rgba(255,255,255,.18)')}
      onMouseLeave={(e) => (e.currentTarget.style.background = 'rgba(255,255,255,.08)')}>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
        <path d={dir === 'left' ? 'M11 3L5 9l6 6' : 'M7 3l6 6-6 6'} /></svg>
    </button>
  );

  // Portal to body so position:fixed is the real viewport regardless of any
  // transform on DesignCanvas's ancestors (including the canvas zoom itself).
  return ReactDOM.createPortal(
    <div onClick={() => ctx.setFocus(null)}
      onWheel={(e) => e.preventDefault()}
      style={{ position: 'fixed', inset: 0, zIndex: 100, background: 'rgba(24,20,16,.6)', backdropFilter: 'blur(14px)',
        fontFamily: DC.font, color: '#fff' }}>

      {/* top bar: section dropdown (left) · close (right) */}
      <div onClick={(e) => e.stopPropagation()}
        style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 72, display: 'flex', alignItems: 'flex-start', padding: '16px 20px 0', gap: 16 }}>
        <div style={{ position: 'relative' }}>
          <button onClick={() => setDd((o) => !o)}
            style={{ border: 'none', background: 'transparent', color: '#fff', cursor: 'pointer', padding: '6px 8px',
              borderRadius: 6, textAlign: 'left', fontFamily: 'inherit' }}>
            <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ fontSize: 18, fontWeight: 600, letterSpacing: -0.3 }}>{meta.title}</span>
              <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" style={{ opacity: .7 }}><path d="M2 4l3.5 3.5L9 4"/></svg>
            </span>
            {meta.subtitle && <span style={{ display: 'block', fontSize: 13, opacity: .6, fontWeight: 400, marginTop: 2 }}>{meta.subtitle}</span>}
          </button>
          {ddOpen && (
            <div style={{ position: 'absolute', top: '100%', left: 0, marginTop: 4, background: '#2a251f', borderRadius: 8,
              boxShadow: '0 8px 32px rgba(0,0,0,.4)', padding: 4, minWidth: 200, zIndex: 10 }}>
              {sectionOrder.map((sid) => (
                <button key={sid} onClick={() => { setDd(false); const f = sectionMeta[sid].slotIds[0]; if (f) ctx.setFocus(`${sid}/${f}`); }}
                  style={{ display: 'block', width: '100%', textAlign: 'left', border: 'none', cursor: 'pointer',
                    background: sid === sectionId ? 'rgba(255,255,255,.1)' : 'transparent', color: '#fff',
                    padding: '8px 12px', borderRadius: 5, fontSize: 14, fontWeight: sid === sectionId ? 600 : 400, fontFamily: 'inherit' }}>
                  {sectionMeta[sid].title}
                </button>
              ))}
            </div>
          )}
        </div>
        <div style={{ flex: 1 }} />
        <button onClick={() => ctx.setFocus(null)}
          onMouseEnter={(e) => (e.currentTarget.style.background = 'rgba(255,255,255,.12)')}
          onMouseLeave={(e) => (e.currentTarget.style.background = 'transparent')}
          style={{ border: 'none', background: 'transparent', color: 'rgba(255,255,255,.7)', width: 32, height: 32,
            borderRadius: 16, fontSize: 20, cursor: 'pointer', lineHeight: 1, transition: 'background .12s' }}>×</button>
      </div>

      {/* card centered, label + index below — only the card itself stops
          propagation so any backdrop click (including the margins around
          the card) exits focus */}
      <div
        style={{ position: 'absolute', top: 64, bottom: 56, left: 100, right: 100, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 16 }}>
        <div onClick={(e) => e.stopPropagation()} style={{ width: width * scale, height: height * scale, position: 'relative' }}>
          <div style={{ width, height, transform: `scale(${scale})`, transformOrigin: 'top left', background: '#fff', borderRadius: 2, overflow: 'hidden',
            boxShadow: '0 20px 80px rgba(0,0,0,.4)' }}>
            {children || <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#bbb' }}>{aid}</div>}
          </div>
        </div>
        <div onClick={(e) => e.stopPropagation()} style={{ fontSize: 14, fontWeight: 500, opacity: .85, textAlign: 'center' }}>
          {(sec.labels || {})[aid] ?? artboard.props.label}
          <span style={{ opacity: .5, marginLeft: 10, fontVariantNumeric: 'tabular-nums' }}>{idx + 1} / {peers.length}</span>
        </div>
      </div>

      <Arrow dir="left" onClick={() => go(-1)} />
      <Arrow dir="right" onClick={() => go(1)} />

      {/* dots */}
      <div onClick={(e) => e.stopPropagation()}
        style={{ position: 'absolute', bottom: 20, left: '50%', transform: 'translateX(-50%)', display: 'flex', gap: 8 }}>
        {peers.map((p, i) => (
          <button key={p} onClick={() => ctx.setFocus(`${sectionId}/${p}`)}
            style={{ border: 'none', padding: 0, cursor: 'pointer', width: 6, height: 6, borderRadius: 3,
              background: i === idx ? '#fff' : 'rgba(255,255,255,.3)' }} />
        ))}
      </div>
    </div>,
    document.body,
  );
}

// ─────────────────────────────────────────────────────────────
// Post-it — absolute-positioned sticky note
// ─────────────────────────────────────────────────────────────
function DCPostIt({ children, top, left, right, bottom, rotate = -2, width = 180 }) {
  return (
    <div style={{
      position: 'absolute', top, left, right, bottom, width,
      background: DC.postitBg, padding: '14px 16px',
      fontFamily: '"Comic Sans MS", "Marker Felt", "Segoe Print", cursive',
      fontSize: 14, lineHeight: 1.4, color: DC.postitText,
      boxShadow: '0 2px 8px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08)',
      transform: `rotate(${rotate}deg)`,
      zIndex: 5,
    }}>{children}</div>
  );
}

Object.assign(window, { DesignCanvas, DCSection, DCArtboard, DCPostIt });

  <script type="text/babel">
// Вариант A — "Archive"
// Редакционный монохром: бумажный фон, графитовый текст, киноварь как единственный акцент.
// Тонкие линии, большие засечки, вдумчивые интервалы. Ощущение монографии.

const ArchiveA = () => {
  const data = window.TIMELINE_DATA;
  const { min, max } = data.range;

  // Контейнер и зум
  const [zoom, setZoom] = React.useState(1.2); // 1 = fit
  const [pan, setPan] = React.useState(0);     // px
  const scrollRef = React.useRef(null);

  // Какие контекстные линии добавлены
  const [activeLines, setActiveLines] = React.useState(['religion']);
  // Порядок линий (drag-reorder)
  const [lineOrder, setLineOrder] = React.useState(['religion', 'wars', 'regimes', 'tech', 'ideas']);
  // Hover / выбор
  const [hover, setHover] = React.useState(null); // {kind, data, x, y}
  const [pinned, setPinned] = React.useState(null);
  const [article, setArticle] = React.useState(null); // {kind, item} — открытая статья

  // Drag для перестановки линий
  const [dragLine, setDragLine] = React.useState(null);

  // map: 'object' -> 'objects' и т.п. (для модуля статей/иконок)
  const kindPlural = { object: 'objects', style: 'styles', epoch: 'epochs' };

  const baseYear = 3230; // max-min
  const basePxPerYear = 0.55;
  const pxPerYear = basePxPerYear * zoom;
  const totalWidth = baseYear * pxPerYear;

  const yearToX = (y) => (y - min) * pxPerYear;

  // ── lane-packing: для не-наложения интервалов ──
  function packLanes(items, getStart, getEnd, gap) {
    const lanes = [];
    const out = new Map();
    const sorted = items.map((it, i) => ({ it, i })).sort((a,b) => getStart(a.it) - getStart(b.it));
    for (const { it, i } of sorted) {
      const s = getStart(it), e = getEnd(it);
      let lane = 0;
      while (lane < lanes.length && lanes[lane] + (gap||0) > s) lane++;
      lanes[lane] = e;
      out.set(it.id ?? i, lane);
    }
    return { lanes: out, count: lanes.length || 1 };
  }
  function packPoints(items, getYear, minPxGap, pxPerYear) {
    const lanes = [];
    const out = new Map();
    const sorted = items.map((it, i) => ({ it, i })).sort((a,b) => getYear(a.it) - getYear(b.it));
    for (const { it, i } of sorted) {
      const x = getYear(it) * pxPerYear;
      let lane = 0;
      while (lane < lanes.length && (x - lanes[lane]) < minPxGap) lane++;
      lanes[lane] = x;
      out.set(it.id ?? i, lane);
    }
    return { lanes: out, count: lanes.length || 1 };
  }

  // Деления шкалы
  const ticks = React.useMemo(() => {
    const step = zoom < 0.8 ? 200 : zoom < 1.5 ? 100 : zoom < 3 ? 50 : 25;
    const out = [];
    const startTick = Math.ceil(min / step) * step;
    for (let y = startTick; y <= max; y += step) out.push(y);
    return out;
  }, [zoom]);

  const formatYear = (y) => y < 0 ? `${-y} до н.э.` : `${y}`;

  const toggleLine = (id) => {
    setActiveLines(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  };

  // Перестановка линий drag&drop
  const reorder = (from, to) => {
    setLineOrder(order => {
      const a = order.slice();
      const [m] = a.splice(from, 1);
      a.splice(to, 0, m);
      return a;
    });
  };

  const sortedActive = lineOrder.filter(id => activeLines.includes(id));

  // Высота строк
  const ROW_EPOCH = 46;
  const ROW_STYLE = 34;
  const ROW_OBJECT = 70;
  const ROW_CONTEXT = 44;

  const card = pinned || hover;

  return (
    <div style={archiveStyles.root} onMouseMove={(e) => {
      if (hover && !pinned) setHover(h => h ? {...h, x: e.clientX, y: e.clientY} : h);
    }}>
      {/* Шапка */}
      <header style={archiveStyles.header}>
        <div style={archiveStyles.brand}>
          <div style={archiveStyles.brandMark}>2ВХУТЕМАС</div>
          <div style={archiveStyles.brandSub}>Учебный портал · Школа архитектуры</div>
        </div>
        <nav style={archiveStyles.nav}>
          {['Таймлайн', 'Карта', 'Портфолио', 'Библиотека', 'Новости'].map((n, i) => (
            <a key={n} style={{...archiveStyles.navLink, ...(i === 0 ? archiveStyles.navLinkActive : {})}}>{n}</a>
          ))}
        </nav>
        <div style={archiveStyles.headerMeta}>
          <span style={archiveStyles.metaIndex}>§02</span>
          <span style={archiveStyles.metaDate}>APR 2026</span>
        </div>
      </header>

      {/* Title block */}
      <section style={archiveStyles.titleBlock}>
        <div style={archiveStyles.kicker}>Исследовательская песочница</div>
        <h1 style={archiveStyles.title}>
          Таймлайн<br/>
          <span style={archiveStyles.titleAccent}>архитектурных эпох</span>
        </h1>
        <div style={archiveStyles.lede}>
          Эпохи, стили и отдельные объекты на одной оси. Добавляйте контекстные линии — войны, религии,
          технологии, идеи — чтобы увидеть, что чему было современником.
        </div>
        <div style={archiveStyles.legendRow}>
          <span style={archiveStyles.legendItem}><span style={{...archiveStyles.legendSwatch, background: '#1A1A1A'}} /> Эпоха</span>
          <span style={archiveStyles.legendItem}><span style={{...archiveStyles.legendSwatch, background: '#C8321E'}} /> Стиль</span>
          <span style={archiveStyles.legendItem}><span style={{...archiveStyles.legendSwatch, border: '1px solid #1A1A1A', background: 'transparent', borderRadius: '50%'}} /> Объект</span>
          <span style={archiveStyles.legendItem}><span style={{...archiveStyles.legendSwatch, background: '#9C8B6B'}} /> Контекст</span>
        </div>
      </section>

      {/* Панель управления */}
      <div style={archiveStyles.controls}>
        <div style={archiveStyles.controlGroup}>
          <span style={archiveStyles.controlLabel}>Масштаб</span>
          <button style={archiveStyles.zoomBtn} onClick={() => setZoom(z => Math.max(0.5, z - 0.3))}>−</button>
          <span style={archiveStyles.zoomValue}>{zoom.toFixed(1)}×</span>
          <button style={archiveStyles.zoomBtn} onClick={() => setZoom(z => Math.min(5, z + 0.3))}>+</button>
        </div>
        <div style={archiveStyles.controlGroup}>
          <span style={archiveStyles.controlLabel}>Линии контекста</span>
          {data.contextLines.map(l => (
            <button
              key={l.id}
              onClick={() => toggleLine(l.id)}
              style={{
                ...archiveStyles.chip,
                ...(activeLines.includes(l.id) ? archiveStyles.chipActive : {})
              }}
            >
              {activeLines.includes(l.id) ? '−' : '+'} {l.label}
            </button>
          ))}
        </div>
      </div>

      {/* Шкала */}
      <div style={archiveStyles.stage} ref={scrollRef}>
        <div style={{ ...archiveStyles.track, width: totalWidth + 120 }}>
          {/* Годовые засечки */}
          <div style={archiveStyles.axisRow}>
            {ticks.map(y => (
              <div key={y} style={{ ...archiveStyles.tick, left: yearToX(y) + 60 }}>
                <div style={archiveStyles.tickLine} />
                <div style={archiveStyles.tickLabel}>{formatYear(y)}</div>
              </div>
            ))}
            {/* Век-метки */}
            {[0, 1000, 1500, 1900, 2000].map(y => (
              <div key={'big'+y} style={{ ...archiveStyles.bigTick, left: yearToX(y) + 60 }}>
                <div style={archiveStyles.bigTickLine} />
              </div>
            ))}
          </div>

          {/* ЭПОХИ */}
          {(() => {
            const ep = packLanes(data.epochs, e => e.start, e => e.end, 50);
            const laneH = 44;
            const h = Math.max(ROW_EPOCH, ep.count * laneH + 4);
            return (
          <div style={{ ...archiveStyles.row, height: h }}>
            <div style={archiveStyles.rowLabel}>ЭПОХИ</div>
            {data.epochs.map((e, i) => {
              const x1 = yearToX(e.start);
              const x2 = yearToX(e.end);
              const lane = ep.lanes.get(e.id) || 0;
              return (
                <div
                  key={e.id}
                  style={{
                    ...archiveStyles.epochBar,
                    left: x1 + 60,
                    width: x2 - x1,
                    top: lane * laneH,
                  }}
                  onMouseEnter={(ev) => setHover({ kind: 'epoch', data: e, x: ev.clientX, y: ev.clientY })}
                  onMouseLeave={() => setHover(null)}
                  onClick={(ev) => setArticle({ kind: 'epochs', item: e })}
                >
                  <span style={archiveStyles.epochLabel}>{e.label}</span>
                  <span style={archiveStyles.epochYears}>{formatYear(e.start)} — {formatYear(e.end)}</span>
                </div>
              );
            })}
          </div>
            );
          })()}

          {/* СТИЛИ */}
          {(() => {
            const stp = packLanes(data.styles, s => s.start, s => s.end, 30);
            const laneH = ROW_STYLE + 2;
            const h = Math.max(ROW_STYLE * 2 + 6, stp.count * laneH + 4);
            return (
          <div style={{ ...archiveStyles.row, height: h }}>
            <div style={archiveStyles.rowLabel}>СТИЛИ</div>
            {data.styles.map((s, i) => {
              const x1 = yearToX(s.start);
              const x2 = yearToX(s.end);
              const lane = stp.lanes.get(s.id) || 0;
              return (
                <div
                  key={s.id}
                  style={{
                    ...archiveStyles.styleBar,
                    left: x1 + 60,
                    width: x2 - x1,
                    top: lane * laneH,
                  }}
                  onMouseEnter={(ev) => setHover({ kind: 'style', data: s, x: ev.clientX, y: ev.clientY })}
                  onMouseLeave={() => setHover(null)}
                  onClick={(ev) => setArticle({ kind: 'styles', item: s })}
                >
                  <span style={archiveStyles.styleLabel}>{s.label}</span>
                </div>
              );
            })}
          </div>
            );
          })()}

          {/* ОБЪЕКТЫ */}
          {(() => {
            const op = packPoints(data.objects, o => o.year, 130, pxPerYear);
            const laneH = 28;
            const h = Math.max(ROW_OBJECT + 40, op.count * laneH + 12);
            return (
          <div style={{ ...archiveStyles.row, height: h }}>
            <div style={archiveStyles.rowLabel}>ОБЪЕКТЫ</div>
            {data.objects.map((o, i) => {
              const x = yearToX(o.year);
              const lane = op.lanes.get(o.id) || 0;
              return (
                <div
                  key={o.id}
                  style={{ ...archiveStyles.objDot, left: x + 60, top: lane * laneH + 4 }}
                  onMouseEnter={(ev) => setHover({ kind: 'object', data: o, x: ev.clientX, y: ev.clientY })}
                  onMouseLeave={() => setHover(null)}
                  onClick={(ev) => setArticle({ kind: 'objects', item: o })}
                >
                  <span style={{ ...archiveStyles.objDotMark, display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden', width: 22, height: 22, borderRadius: 0, padding: 2, color: '#1A1A1A', background: '#F2EFE8' }}>
                    <ArtIcon kind="objects" id={o.id} size={16} color="#1A1A1A" />
                  </span>
                  <span style={{ ...archiveStyles.objDotLabel, left: 28 }}>{o.label}</span>
                  <span style={{ ...archiveStyles.objDotYear, left: 28 }}>{formatYear(o.year)}</span>
                </div>
              );
            })}
          </div>
            );
          })()}

          {/* КОНТЕКСТНЫЕ ЛИНИИ */}
          {sortedActive.map((lineId, idx) => {
            const line = data.contextLines.find(l => l.id === lineId);
            return (
              <div
                key={lineId}
                draggable
                onDragStart={() => setDragLine(idx)}
                onDragOver={(e) => e.preventDefault()}
                onDrop={() => { if (dragLine !== null && dragLine !== idx) reorder(dragLine, idx); setDragLine(null); }}
                style={{ ...archiveStyles.row, ...archiveStyles.contextRow, height: ROW_CONTEXT, opacity: dragLine === idx ? 0.4 : 1 }}
              >
                <div style={{ ...archiveStyles.rowLabel, ...archiveStyles.contextLabel }}>
                  <span style={archiveStyles.dragHandle}>≡</span>
                  {line.label.toUpperCase()}
                </div>
                {line.segments.map((seg, si) => {
                  const x1 = yearToX(seg.start);
                  const x2 = yearToX(seg.end);
                  return (
                    <div
                      key={si}
                      style={{
                        ...archiveStyles.contextSeg,
                        left: x1 + 60,
                        width: x2 - x1,
                      }}
                      onMouseEnter={(ev) => setHover({ kind: 'context', data: { ...seg, lineLabel: line.label }, x: ev.clientX, y: ev.clientY })}
                      onMouseLeave={() => setHover(null)}
                      onClick={(ev) => { ev.stopPropagation(); setArticle({ kind: 'context', item: { ...seg, id: seg, lineLabel: line.label } }); }}
                    >
                      <span style={archiveStyles.contextSegLabel}>{seg.label}</span>
                    </div>
                  );
                })}
              </div>
            );
          })}

          <div style={{ height: 40 }} />
        </div>
      </div>

      {/* Hover-карточка */}
      {card && (
        <div style={{
          ...archiveStyles.card,
          left: Math.min(card.x + 20, window.innerWidth - 360),
          top: Math.min(card.y + 20, window.innerHeight - 260),
        }} onClick={(e) => e.stopPropagation()}>
          <div style={archiveStyles.cardHeader}>
            <span style={archiveStyles.cardKind}>
              {card.kind === 'epoch' && 'ЭПОХА'}
              {card.kind === 'style' && 'СТИЛЬ'}
              {card.kind === 'object' && 'ОБЪЕКТ'}
              {card.kind === 'context' && (card.data.lineLabel || 'КОНТЕКСТ').toUpperCase()}
            </span>
            {pinned && <button style={archiveStyles.cardClose} onClick={() => setPinned(null)}>×</button>}
          </div>
          {card.kind !== 'context' && (
            <div style={{ display: 'flex', gap: 14, alignItems: 'flex-start', marginBottom: 8 }}>
              <div style={{ width: 64, height: 64, border: '1px solid #1A1A1A', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, background: 'rgba(26,26,26,0.04)' }}>
                <ArtIcon kind={kindPlural[card.kind]} id={card.data.id} size={48} color="#1A1A1A" />
              </div>
              <div style={{ ...archiveStyles.cardTitle, marginBottom: 0, flex: 1 }}>{card.data.label}</div>
            </div>
          )}
          {card.kind === 'context' && (
            <div style={archiveStyles.cardTitle}>{card.data.label}</div>
          )}
          {card.kind === 'object' && (
            <div style={archiveStyles.cardMeta}>
              <div><span>Год</span><b>{formatYear(card.data.year)}</b></div>
              <div><span>Архитектор</span><b>{card.data.arch}</b></div>
              <div><span>Место</span><b>{card.data.place}</b></div>
            </div>
          )}
          {(card.kind === 'epoch' || card.kind === 'style') && (
            <div style={archiveStyles.cardMeta}>
              <div><span>Период</span><b>{formatYear(card.data.start)} — {formatYear(card.data.end)}</b></div>
              {card.data.note && <div><span>Заметка</span><b style={{fontWeight: 400}}>{card.data.note}</b></div>}
            </div>
          )}
          {card.kind === 'context' && (
            <div style={archiveStyles.cardMeta}>
              <div><span>Период</span><b>{formatYear(card.data.start)} — {formatYear(card.data.end)}</b></div>
            </div>
          )}
          <div style={archiveStyles.cardFoot}>
            {card.kind !== 'context' && (
              <button
                onClick={(e) => { e.stopPropagation(); setArticle({ kind: kindPlural[card.kind], item: card.data }); }}
                style={{
                  border: '1px solid #1A1A1A', background: '#1A1A1A', color: '#F2EFE8',
                  padding: '8px 14px', cursor: 'pointer',
                  fontFamily: '"JetBrains Mono", monospace', fontSize: 10, letterSpacing: '0.18em',
                  marginBottom: 8, marginTop: -4,
                }}
              >ОТКРЫТЬ СТАТЬЮ →</button>
            )}
            <div>{pinned ? '' : 'Кликните, чтобы закрепить'}</div>
          </div>
        </div>
      )}

      {article && (
        <ArticleSheet
          item={article.item}
          kind={article.kind}
          theme="archive"
          onClose={() => setArticle(null)}
        />
      )}

      {pinned && <div style={archiveStyles.pinOverlay} onClick={() => setPinned(null)} />}
    </div>
  );
};

const archiveStyles = {
  root: {
    width: '100%',
    minHeight: '100%',
    background: '#F2EFE8',
    color: '#1A1A1A',
    fontFamily: '"Inter Tight", "Söhne", -apple-system, system-ui, sans-serif',
    fontFeatureSettings: '"ss01", "cv11"',
    position: 'relative',
    overflow: 'hidden',
  },
  header: {
    display: 'grid',
    gridTemplateColumns: '1fr auto 1fr',
    alignItems: 'center',
    padding: '20px 48px',

  <script type="text/babel">
// Вариант B — "Lab"
// Экспериментальная инженерная песочница: тёмный фон, моноширинный шрифт, цветные линии,
// миллиметровочная сетка, ощущение научной визуализации / CAD-интерфейса.

const LabB = () => {
  const data = window.TIMELINE_DATA;
  const { min, max } = data.range;

  const [zoom, setZoom] = React.useState(1);
  const [activeLines, setActiveLines] = React.useState(['religion', 'wars', 'tech']);
  const [lineOrder, setLineOrder] = React.useState(['religion', 'wars', 'regimes', 'tech', 'ideas']);
  const [hover, setHover] = React.useState(null);
  const [pinned, setPinned] = React.useState(null);
  const [dragLine, setDragLine] = React.useState(null);
  const [highlight, setHighlight] = React.useState(null); // год, над которым курсор
  const [filter, setFilter] = React.useState({ epochs: true, styles: true, objects: true });
  const [mainOrder, setMainOrder] = React.useState(['epochs', 'styles', 'objects']);
  const [mainDrag, setMainDrag] = React.useState(null);
  const [article, setArticle] = React.useState(null);
  const kindPlural = { object: 'objects', style: 'styles', epoch: 'epochs' };

  const stageRef = React.useRef(null);

  const basePxPerYear = 0.5;
  const pxPerYear = basePxPerYear * zoom;
  const totalWidth = (max - min) * pxPerYear;

  const yearToX = (y) => (y - min) * pxPerYear;
  const xToYear = (x) => Math.round(x / pxPerYear + min);

  // ── lane-packing: для не-наложения интервалов ──
  function packLanes(items, getStart, getEnd, gap) {
    const lanes = []; // lanes[i] = end-year занятой полосы
    const out = new Map();
    const sorted = items.map((it, i) => ({ it, i })).sort((a,b) => getStart(a.it) - getStart(b.it));
    for (const { it, i } of sorted) {
      const s = getStart(it), e = getEnd(it);
      let lane = 0;
      while (lane < lanes.length && lanes[lane] + (gap||0) > s) lane++;
      lanes[lane] = e;
      out.set(it.id ?? i, lane);
    }
    return { lanes: out, count: lanes.length || 1 };
  }
  function packPoints(items, getYear, minPxGap, pxPerYear) {
    // points: ставим в lane так, чтобы соседи в той же lane были дальше minPxGap
    const lanes = []; // lanes[i] = последний x в лейне
    const out = new Map();
    const sorted = items.map((it, i) => ({ it, i })).sort((a,b) => getYear(a.it) - getYear(b.it));
    for (const { it, i } of sorted) {
      const x = getYear(it) * pxPerYear;
      let lane = 0;
      while (lane < lanes.length && (x - lanes[lane]) < minPxGap) lane++;
      lanes[lane] = x;
      out.set(it.id ?? i, lane);
    }
    return { lanes: out, count: lanes.length || 1 };
  }


  const formatYear = (y) => y < 0 ? `${-y} BCE` : `${y} CE`;

  const ticks = React.useMemo(() => {
    const step = zoom < 0.7 ? 250 : zoom < 1.3 ? 100 : zoom < 2.5 ? 50 : 25;
    const out = [];
    const startTick = Math.ceil(min / step) * step;
    for (let y = startTick; y <= max; y += step) out.push(y);
    return out;
  }, [zoom]);

  const toggleLine = (id) => {
    setActiveLines(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  };

  const reorder = (from, to) => {
    setLineOrder(order => {
      const a = order.slice();
      const [m] = a.splice(from, 1);
      a.splice(to, 0, m);
      return a;
    });
  };

  const sortedActive = lineOrder.filter(id => activeLines.includes(id));

  const reorderMain = (from, to) => {
    setMainOrder(order => {
      const a = order.slice();
      const [m] = a.splice(from, 1);
      a.splice(to, 0, m);
      return a;
    });
  };

  const colorMap = {
    red:    '#FF4538',
    ochre:  '#E8B84F',
    blue:   '#3E6BFF',
    green:  '#3EE88A',
    violet: '#B36BFF',
  };

  const card = pinned || hover;

  // Перемещение курсора по шкале
  const onMouseMoveStage = (e) => {
    if (!stageRef.current) return;
    const rect = stageRef.current.getBoundingClientRect();
    const x = e.clientX - rect.left + stageRef.current.scrollLeft - 180;
    setHighlight(xToYear(x));
    if (hover && !pinned) setHover(h => h ? {...h, x: e.clientX, y: e.clientY} : h);
  };

  return (
    <div style={labStyles.root}>
      {/* Grid background */}
      <div style={labStyles.gridBg} />

      {/* Header — теперь несёт и заголовок, и метаданные */}
      <header style={labStyles.header}>
        <div style={labStyles.brand}>
          <span style={labStyles.brandGlyph}>◉</span>
          <span style={labStyles.brandName}>2ВХУТЕМАС</span>
          <span style={labStyles.brandDiv}>/</span>
          <span style={labStyles.brandPath}>лаборатория / таймлайн</span>
          <span style={labStyles.brandDiv}>·</span>
          <span style={{...labStyles.brandPath, color:'#3EE88A', letterSpacing:'0.2em'}}>v0.2</span>
        </div>
        <div style={labStyles.headerStats}>
          <div style={labStyles.stat}><span>ЭПОХИ</span><b>{data.epochs.length}</b></div>
          <div style={labStyles.stat}><span>СТИЛИ</span><b>{data.styles.length}</b></div>
          <div style={labStyles.stat}><span>ОБЪЕКТЫ</span><b>{data.objects.length}</b></div>
          <div style={labStyles.stat}><span>ЛИНИИ</span><b>{activeLines.length}/{data.contextLines.length}</b></div>
          <div style={labStyles.stat}><span>КУРСОР</span><b style={{color:'#3EE88A'}}>{highlight != null ? formatYear(highlight) : '—'}</b></div>
        </div>
      </header>

      {/* Slim title strip */}
      <section style={labStyles.titleBlock}>
        <div style={labStyles.titleRow}>
          <div style={labStyles.tag}>◆ Исследовательская песочница</div>
          <h1 style={labStyles.title}>Архитектурный таймлайн<span style={labStyles.titleDot}>.</span></h1>
        </div>
        <div style={labStyles.axisRange}>
          <span>T₀ = {formatYear(min)}</span>
          <span style={{opacity: 0.25}}>—</span>
          <span>T₁ = {formatYear(max)}</span>
          <span style={{opacity: 0.3}}>Δ = {max - min} лет</span>
        </div>
      </section>

      {/* Controls */}
      <div style={labStyles.controls}>
        <div style={labStyles.controlGroup}>
          <span style={labStyles.controlLabel}>МАСШТАБ</span>
          <button style={labStyles.btn} onClick={() => setZoom(z => Math.max(0.4, z - 0.3))}>−</button>
          <div style={labStyles.zoomReadout}>×{zoom.toFixed(2)}</div>
          <button style={labStyles.btn} onClick={() => setZoom(z => Math.min(6, z + 0.3))}>+</button>
        </div>
        <div style={labStyles.controlGroup}>
          <span style={labStyles.controlLabel}>СЛОИ</span>
          {['epochs', 'styles', 'objects'].map(k => (
            <button
              key={k}
              onClick={() => setFilter(f => ({...f, [k]: !f[k]}))}
              style={{...labStyles.toggle, ...(filter[k] ? labStyles.toggleOn : {})}}
            >
              <span style={labStyles.toggleBox}>{filter[k] ? '■' : '□'}</span>
              {({epochs:'ЭПОХИ', styles:'СТИЛИ', objects:'ОБЪЕКТЫ'})[k]}
            </button>
          ))}
        </div>
        <div style={labStyles.controlGroup}>
          <span style={labStyles.controlLabel}>+ ДОБАВИТЬ ЛИНИЮ</span>
          {data.contextLines.map(l => (
            <button
              key={l.id}
              onClick={() => toggleLine(l.id)}
              style={{
                ...labStyles.toggle,
                borderColor: activeLines.includes(l.id) ? colorMap[l.color] : 'rgba(255,255,255,0.15)',
                color: activeLines.includes(l.id) ? colorMap[l.color] : 'rgba(255,255,255,0.55)',
                background: activeLines.includes(l.id) ? `${colorMap[l.color]}15` : 'transparent',
              }}
            >
              <span style={{...labStyles.colorDot, background: colorMap[l.color]}} />
              {l.label.toUpperCase()}
            </button>
          ))}
        </div>
      </div>

      {/* Stage */}
      <div style={labStyles.stage} ref={stageRef} onMouseMove={onMouseMoveStage}>
        <div style={{ ...labStyles.track, width: totalWidth + 220 }}>
          {/* Годовая сетка (вертикальные линии) */}
          {ticks.map(y => (
            <div key={'v'+y} style={{
              ...labStyles.vLine,
              left: yearToX(y) + 180,
              opacity: y % 500 === 0 ? 0.35 : y % 100 === 0 ? 0.15 : 0.06,
            }} />
          ))}

          {/* Year scale top */}
          <div style={labStyles.yearBar}>
            {ticks.map(y => (
              <div key={y} style={{ ...labStyles.yearMark, left: yearToX(y) + 180 }}>
                <span style={labStyles.yearText}>{y < 0 ? `-${-y}` : y}</span>
              </div>
            ))}
            {/* Курсор */}
            {highlight != null && (
              <div style={{ ...labStyles.cursorLine, left: yearToX(highlight) + 180 }}>
                <span style={labStyles.cursorPill}>{formatYear(highlight)}</span>
              </div>
            )}
          </div>

          {/* MAIN ROWS — draggable order */}
          {mainOrder.map((rowKind, idx) => {
            if (!filter[rowKind]) return null;
            const rowProps = {
              key: rowKind,
              draggable: true,
              onDragStart: () => setMainDrag(idx),
              onDragOver: (e) => { e.preventDefault(); },
              onDrop: () => { if (mainDrag !== null && mainDrag !== idx) reorderMain(mainDrag, idx); setMainDrag(null); },
              onDragEnd: () => setMainDrag(null),
            };
            const rowStyle = (h) => ({
              ...labStyles.row, height: h,
              opacity: mainDrag === idx ? 0.3 : 1,
              outline: mainDrag !== null && mainDrag !== idx ? '1px dashed rgba(62,232,138,0.25)' : 'none',
              outlineOffset: -1,
              transition: 'opacity 120ms',
            });

            if (rowKind === 'epochs') {
              const ep = packLanes(data.epochs, e => e.start, e => e.end, 30);
              const laneH = 44;
              const h = Math.max(50, ep.count * laneH + 6);
              return (
                <div {...rowProps} style={rowStyle(h)}>
                  <div style={labStyles.rowLabel}>
                    <span style={labStyles.dragHandle} title="Перетащите для смены порядка">⋮⋮</span>
                    // ЭПОХИ
                  </div>
                  {data.epochs.map((e, i) => {
                    const x1 = yearToX(e.start);
                    const x2 = yearToX(e.end);
                    const lane = ep.lanes.get(e.id) || 0;
                    return (
                      <div
                        key={e.id}
                        style={{ ...labStyles.epochBar, left: x1 + 180, width: x2 - x1, top: lane * laneH }}
                        onMouseEnter={(ev) => setHover({ kind: 'epoch', data: e, x: ev.clientX, y: ev.clientY })}
                        onMouseLeave={() => setHover(null)}
                        onClick={(ev) => setArticle({ kind: 'epochs', item: e })}
                      >
                        <span style={labStyles.barLabel}>{e.label}</span>
                        <span style={labStyles.barYear}>[{e.start}→{e.end}]</span>
                      </div>
                    );
                  })}
                </div>
              );
            }
            if (rowKind === 'styles') {
              const stp = packLanes(data.styles, s => s.start, s => s.end, 20);
              const laneH = 34;
              const h = Math.max(70, stp.count * laneH + 6);
              return (
                <div {...rowProps} style={rowStyle(h)}>
                  <div style={labStyles.rowLabel}>
                    <span style={labStyles.dragHandle} title="Перетащите для смены порядка">⋮⋮</span>
                    // СТИЛИ
                  </div>
                  {data.styles.map((s, i) => {
                    const x1 = yearToX(s.start);
                    const x2 = yearToX(s.end);
                    const lane = stp.lanes.get(s.id) || 0;
                    return (
                      <div
                        key={s.id}
                        style={{ ...labStyles.styleBar, left: x1 + 180, width: x2 - x1, top: lane * laneH }}
                        onMouseEnter={(ev) => setHover({ kind: 'style', data: s, x: ev.clientX, y: ev.clientY })}
                        onMouseLeave={() => setHover(null)}
                        onClick={(ev) => setArticle({ kind: 'styles', item: s })}
                      >
                        <span style={labStyles.styleDash} />
                        <span style={labStyles.styleLabelText}>{s.label}</span>
                      </div>
                    );
                  })}
                </div>
              );
            }
            if (rowKind === 'objects') {
              const op = packPoints(data.objects, o => o.year, 110, pxPerYear);
              const laneH = 26;
              const h = Math.max(120, op.count * laneH + 16);
              return (
                <div {...rowProps} style={rowStyle(h)}>
                  <div style={labStyles.rowLabel}>
                    <span style={labStyles.dragHandle} title="Перетащите для смены порядка">⋮⋮</span>
                    // ОБЪЕКТЫ
                  </div>
                  {data.objects.map((o, i) => {
                    const x = yearToX(o.year);
                    const lane = op.lanes.get(o.id) || 0;
                    return (
                      <div
                        key={o.id}
                        style={{ ...labStyles.objNode, left: x + 180, top: lane * laneH + 6 }}
                        onMouseEnter={(ev) => setHover({ kind: 'object', data: o, x: ev.clientX, y: ev.clientY })}
                        onMouseLeave={() => setHover(null)}
                        onClick={(ev) => setArticle({ kind: 'objects', item: o })}
                      >
                        <span style={{ display: 'inline-flex', width: 16, height: 16, alignItems: 'center', justifyContent: 'center', color: '#3EE88A' }}>
                          <ArtIcon kind="objects" id={o.id} size={14} color="#3EE88A" />
                        </span>
                        <span style={{ ...labStyles.objLabel, left: 20 }}>{o.label}</span>
                        <span style={{ ...labStyles.objYear, left: 20 }}>{o.year}</span>
                      </div>
                    );
                  })}
                </div>
              );
            }
            return null;
          })}

          {/* CONTEXT LINES — draggable */}
          {sortedActive.map((lineId, idx) => {
            const line = data.contextLines.find(l => l.id === lineId);
            const color = colorMap[line.color];
            return (
              <div
                key={lineId}
                draggable
                onDragStart={() => setDragLine(idx)}
                onDragOver={(e) => e.preventDefault()}
                onDrop={() => { if (dragLine !== null && dragLine !== idx) reorder(dragLine, idx); setDragLine(null); }}
                style={{ ...labStyles.row, height: 50, opacity: dragLine === idx ? 0.3 : 1, cursor: 'grab' }}
              >
                <div style={{ ...labStyles.rowLabel, color, textShadow: `0 0 12px ${color}90, 0 0 2px ${color}` }}>
                  <span style={labStyles.dragHandle}>⋮⋮</span>
                  // {line.label.toUpperCase()}
                </div>
                {/* Базовая линия — со свечением */}
                <div style={{
                  position: 'absolute',
                  left: 180, right: 0, top: 23, height: 3,
                  background: `linear-gradient(90deg, transparent 0%, ${color}30 4%, ${color}80 50%, ${color}30 96%, transparent 100%)`,
                  filter: `drop-shadow(0 0 6px ${color}80) drop-shadow(0 0 14px ${color}40)`,
                  borderRadius: 2,
                }} />
                {line.segments.map((seg, si) => {
                  const x1 = yearToX(seg.start);
                  const x2 = yearToX(seg.end);
                  return (
                    <div
                      key={si}
                      style={{
                        ...labStyles.ctxSeg,
                        left: x1 + 180,
                        width: x2 - x1,
                        borderColor: color,
                        background: `linear-gradient(180deg, ${color}28 0%, ${color}10 45%, ${color}05 100%)`,
                        boxShadow: `inset 0 1px 0 ${color}55, inset 0 -1px 0 ${color}20, 0 0 12px ${color}35, 0 0 2px ${color}80`,
                        color,
                      }}
                      onMouseEnter={(ev) => {
                        ev.currentTarget.style.boxShadow = `inset 0 1px 0 ${color}88, inset 0 -1px 0 ${color}30, 0 0 22px ${color}70, 0 0 4px ${color}`;
                        ev.currentTarget.style.background = `linear-gradient(180deg, ${color}50 0%, ${color}1c 50%, ${color}10 100%)`;
                        setHover({ kind: 'context', data: { ...seg, lineLabel: line.label, color }, x: ev.clientX, y: ev.clientY });
                      }}
                      onMouseLeave={(ev) => {
                        ev.currentTarget.style.boxShadow = `inset 0 1px 0 ${color}55, inset 0 -1px 0 ${color}20, 0 0 12px ${color}35, 0 0 2px ${color}80`;
                        ev.currentTarget.style.background = `linear-gradient(180deg, ${color}28 0%, ${color}10 45%, ${color}05 100%)`;
                        setHover(null);
                      }}
                      onClick={(ev) => { ev.stopPropagation(); setArticle({ kind: 'context', item: { ...seg, id: seg, lineLabel: line.label, color } }); }}
                    >
                      <span style={{ ...labStyles.ctxSegLabel, textShadow: `0 0 8px ${color}, 0 0 1px ${color}` }}>{seg.label}</span>
                    </div>
                  );
                })}
              </div>
            );
          })}

          <div style={{ height: 60 }} />
        </div>
      </div>

      {/* Status bar */}
      <footer style={labStyles.footer}>
        <span>● подключено</span>
        <span style={{opacity:0.4}}>|</span>
        <span>перетащите строки, чтобы изменить порядок</span>
        <span style={{opacity:0.4}}>|</span>
        <span>клик — открыть статью</span>
        <span style={{marginLeft:'auto', opacity:0.5}}>сборка 2026.04.22</span>
      </footer>

      {/* Detail card */}
      {card && (
        <div style={{
          ...labStyles.card,
          left: Math.min(card.x + 20, window.innerWidth - 360),
          top: Math.min(card.y + 20, window.innerHeight - 280),
        }} onClick={(e) => e.stopPropagation()}>
          <div style={labStyles.cardTop}>
            <span style={{...labStyles.cardKind, color: card.kind === 'context' ? card.data.color : '#3EE88A'}}>
              {card.kind === 'epoch' && '▣ ЭПОХА'}
              {card.kind === 'style' && '▢ СТИЛЬ'}
              {card.kind === 'object' && '+ ОБЪЕКТ'}
              {card.kind === 'context' && `// ${(card.data.lineLabel||'').toUpperCase()}`}
            </span>
            {pinned && <button style={labStyles.cardClose} onClick={() => setPinned(null)}>×</button>}
          </div>
          {card.kind !== 'context' ? (
            <div style={{ display: 'flex', gap: 12, alignItems: 'flex-start', marginBottom: 12 }}>
              <div style={{ width: 56, height: 56, border: '1px solid rgba(62,232,138,0.4)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, background: 'rgba(62,232,138,0.05)' }}>
                <ArtIcon kind={kindPlural[card.kind]} id={card.data.id} size={42} color="#3EE88A" />
              </div>
              <div style={{ ...labStyles.cardTitle, marginBottom: 0, flex: 1 }}>{card.data.label}</div>
            </div>
          ) : (
            <div style={labStyles.cardTitle}>{card.data.label}</div>
          )}
          <div style={labStyles.cardBody}>
            {card.kind === 'object' && (
              <>
                <div style={labStyles.row2}><span>year</span><b>{formatYear(card.data.year)}</b></div>
                <div style={labStyles.row2}><span>architect</span><b>{card.data.arch}</b></div>
                <div style={labStyles.row2}><span>location</span><b>{card.data.place}</b></div>
              </>
            )}
            {(card.kind === 'epoch' || card.kind === 'style' || card.kind === 'context') && (
              <>
                <div style={labStyles.row2}><span>range</span><b>{formatYear(card.data.start)} → {formatYear(card.data.end)}</b></div>
                <div style={labStyles.row2}><span>duration</span><b>{card.data.end - card.data.start} yrs</b></div>
                {card.data.note && <div style={{...labStyles.row2, flexDirection:'column', alignItems:'flex-start', gap:4}}><span>note</span><b style={{fontWeight:400, fontFamily:'inherit'}}>{card.data.note}</b></div>}
              </>
            )}
            {card.kind !== 'context' && (
              <button
                onClick={(e) => { e.stopPropagation(); setArticle({ kind: kindPlural[card.kind], item: card.data }); }}
                style={{
                  marginTop: 12,
                  border: '1px solid #3EE88A',
                  background: 'rgba(62,232,138,0.08)',
                  color: '#3EE88A',
                  padding: '8px 12px', cursor: 'pointer',
                  fontFamily: 'inherit', fontSize: 10, letterSpacing: '0.18em',
                }}
              >► OPEN ARTICLE</button>
            )}
          </div>
        </div>
      )}
      {pinned && <div style={labStyles.overlay} onClick={() => setPinned(null)} />}
      {article && (
        <ArticleSheet
          item={article.item}
          kind={article.kind}
          theme="lab"
          onClose={() => setArticle(null)}
        />
      )}
    </div>
  );
};
